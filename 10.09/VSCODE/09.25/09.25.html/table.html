<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table {
  border-collapse: collapse;
  width: 70%;
  margin: 30px auto;
  font-family: Arial, Helvetica, sans-serif;
  text-align: center;
}

tr:nth-child(even) {
  background-color: antiquewhite;
}

tr:nth-child(odd) {
  background-color: wheat;
}

th {
  background-color: aqua;
}

tr:hover {
  background-color: aquamarine;
}
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th>Név</th>
                <th>Kor</th>
                <th>Város</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Kovács Anna</td>
                <td>20</td>
                <td>Dunakeszi</td>
            </tr>
            <tr>
                <td>Kiss István</td>
                <td>22</td>
                <td>Göd</td>
            </tr>
            <tr>
                <td>Nagy Milán</td>
                <td>25</td>
                <td>Vác</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
