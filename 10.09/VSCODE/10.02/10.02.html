<html>
<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient gombok</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 50px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }

        .button {
            padding: 15px 40px;
            border: none;
            border-radius: 50px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            text-decoration: none;
            display: inline-block;
        }

        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        /* Különböző gradient gombok */
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .btn-success {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .btn-warning {
            background: linear-gradient(135deg, #fad0c4 0%, #ffd1ff 100%);
            color: #333;
        }

        .btn-info {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            color: #333;
        }

        .btn-ocean {
            background: linear-gradient(90deg, #00d2ff 0%, #3a7bd5 100%);
        }

        .btn-sunset {
            background: linear-gradient(45deg, #ff6e7f 0%, #bfe9ff 100%);
        }

        /* Animált gradient */
        .btn-animated {
            background: linear-gradient(
                45deg,
                #667eea,
                #764ba2,
                #f093fb,
                #667eea
            );
            background-size: 300% 300%;
            animation: gradient-shift 3s ease infinite;
        }

        @keyframes gradient-shift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
    </style>
</head>
<body>
    <h1>Gradient Gombok</h1>
    
    <button class="button btn-primary">Primary gomb</button>
    <button class="button btn-success">Success gomb</button>
    <button class="button btn-warning">Warning gomb</button>
    <button class="button btn-info">Info gomb</button>
    <button class="button btn-ocean">Ocean gomb</button>
    <button class="button btn-sunset">Sunset gomb</button>
    <button class="button btn-animated">Animált gomb</button>
</body>
</html>
