<html>
<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Box-sizing Gyakorlat</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f0f0f0;
        }

        .kontener {
            display: flex;
            gap: 40px;
            margin-bottom: 30px;
        }

        .doboz {
            width: 300px;
            height: 200px;
            padding: 30px;
            border: 10px solid #333;
            background-color: #4CAF50;
            color: white;
        }

        .content-box {
            box-sizing: content-box;
        }

        .border-box {
            box-sizing: border-box;
        }

        .info {
            margin-top: 10px;
            padding: 10px;
            background-color: white;
            border-left: 4px solid #2196F3;
        }
    </style>
</head>
<body>
    <h1>Box-sizing Demonstráció</h1>
    
    <div class="kontener">
        <div>
            <div class="doboz content-box">
                <h3>Content-box</h3>
                <p>Width: 300px</p>
                <p>Padding: 30px</p>
                <p>Border: 10px</p>
            </div>
            <div class="info">
                <strong>Teljes szélesség:</strong> 380px<br>
                (300 + 60 + 20)
            </div>
        </div>
        
        <div>
            <div class="doboz border-box">
                <h3>Border-box</h3>
                <p>Width: 300px</p>
                <p>Padding: 30px</p>
                <p>Border: 10px</p>
            </div>
            <div class="info">
                <strong>Teljes szélesség:</strong> 300px<br>
                (tartalom: 220px)
            </div>
        </div>
    </div>
</body>
</html>
